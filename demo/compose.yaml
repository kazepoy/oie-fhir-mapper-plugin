name: fhir-mapper-demo

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

volumes:
  pgdata:
  appdata:
  logs:

services:
  oie-db:
    image: postgres:18.3-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "idle_in_transaction_session_timeout=15000"]
    environment:
      POSTGRES_DB: oie
      POSTGRES_USER: oie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo-fhir-mapper-db}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U oie -d oie"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  oie-app:
    build:
      context: ..
      dockerfile: demo/Dockerfile
    image: fhir-mapper-demo-oie:4.7.0
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    environment:
      DATABASE: postgres
      DATABASE_URL: jdbc:postgresql://oie-db:5432/oie
      DATABASE_USERNAME: oie
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-demo-fhir-mapper-db}
      _MP_HTTPS_PORT: "8443"
      SERVER_ID: ${OIE_SERVER_ID:-18a8d2ca-8afb-4fd3-a7a6-7123d38aa468}
      KEYSTORE_STOREPASS: ${OIE_KEYSTORE_STOREPASS:-demo-fhir-mapper-store}
      KEYSTORE_KEYPASS: ${OIE_KEYSTORE_KEYPASS:-demo-fhir-mapper-key}
      _MP_PASSWORD_MINLENGTH: "0"
      _MP_SERVER_INITIALADMINPASSWORD: ${OIE_PASSWORD:-admin}
      TZ: ${TZ:-Europe/Paris}
    configs:
      - source: oie-jvm-options
        target: /opt/engine/conf/custom.vmoptions
    ports:
      - "${OIE_BIND_ADDRESS:-127.0.0.1}:${OIE_HTTPS_PORT:-8443}:8443"
      - "10800-10900:10800-10900"
    volumes:
      - appdata:/opt/engine/appdata
      - logs:/opt/engine/logs
      - ./custom-extensions:/opt/engine/custom-extensions
      - ./fhir-volume:/fhir-volume:ro
    depends_on:
      oie-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--no-check-certificate", "-Y", "off", "-T", "8", "-O", "/dev/null", "https://127.0.0.1:8443/oie-webadmin/"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    logging: *logging

  term-server:
    build:
      context: ./term-server
    image: fhir-mapper-demo-term-server:2.0.282
    restart: unless-stopped
    init: true
    read_only: true
    mem_limit: 256m
    environment:
      JAVA_TOOL_OPTIONS: "-Xms16m -Xmx128m -XX:+UseSerialGC -XX:ReservedCodeCacheSize=16m -Dlogback.configurationFile=/opt/hades/logback.xml"
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - ./term-server/resources:/term-server:ro
      - ./term-server/logback.xml:/opt/hades/logback.xml:ro
    ports:
      - "${OIE_BIND_ADDRESS:-127.0.0.1}:${TERM_SERVER_PORT:-8500}:8500"
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:8500/fhir/metadata"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
    logging: *logging

  # Restore the active demo from demo/oie-init/data.
  oie-init:
    image: curlimages/curl:8.21.0
    restart: "no"
    entrypoint: ["/bin/sh", "/init-channels.sh"]
    environment:
      OIE_URL: https://oie-app:8443
      OIE_USER: admin
      OIE_PASSWORD: ${OIE_PASSWORD:-admin}
      OIE_SKIP_FIRST_LOGIN: ${OIE_SKIP_FIRST_LOGIN:-true}
    volumes:
      - ./oie-init:/oie-init:ro
      - ./oie-init/init-channels.sh:/init-channels.sh:ro
    depends_on:
      oie-app:
        condition: service_healthy
      term-server:
        condition: service_healthy
    logging: *logging

configs:
  oie-jvm-options:
    content: |
      -Xmx${OIE_JAVA_MAX_HEAP:-4g}
